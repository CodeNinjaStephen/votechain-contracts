version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Allow PRs to be opened automatically for patches and minor updates

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    assignees:
      - "veracindarella"
    labels:
      - "dependencies"
      - "security"
    allow:
      - dependency-type: "all"

  # Auto-update pinned GitHub Actions SHAs.
  # Dependabot will open grouped PRs to reduce noise when multiple actions
  # release on the same day.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      # Batch all first-party GitHub Actions (actions/*) into one PR.
      github-actions-official:
        patterns:
          - "actions/*"
      # Batch all third-party actions into a separate PR.
      github-actions-third-party:
        patterns:
          - "*"
        exclude-patterns:
          - "actions/*"
